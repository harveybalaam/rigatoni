name: Main

run-name: >-
  Running Main for ${{
    github.event_name == 'pull_request' && 'pull request' ||
    github.event_name
  }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        stage:
          - lint
          - typecheck:electron
          - typecheck:ui
          - test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.stage }}
        run: npm run ${{ matrix.stage }}
